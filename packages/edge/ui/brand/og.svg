<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Custos — guardian of the ledger">
  <rect width="1200" height="630" fill="#0c463c"/>
  <!-- sealed-document frame -->
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#9a7b3f" stroke-width="1.5" opacity="0.7"/>
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="#9a7b3f" stroke-width="0.6" opacity="0.4"/>

  <!-- seal mark -->
  <g transform="translate(550,150) scale(1.5625)">
    <polygon points="22,8 42,8 56,22 56,42 42,56 22,56 8,42 8,22" fill="#0e5247"/>
    <polygon points="22,8 42,8 56,22 56,42 42,56 22,56 8,42 8,22" fill="none" stroke="#9a7b3f" stroke-width="2.4"/>
    <path d="M40.6 19.7 A15 15 0 1 0 40.6 44.3" fill="none" stroke="#f6f2e9" stroke-width="7" stroke-linecap="round"/>
    <rect x="41" y="28" width="8" height="8" rx="1.2" transform="rotate(45 45 32)" fill="#9a7b3f"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="360" text-anchor="middle" fill="#f6f2e9"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800"
        letter-spacing="12">CUSTOS</text>

  <!-- rule -->
  <line x1="540" y1="398" x2="660" y2="398" stroke="#9a7b3f" stroke-width="2"/>

  <!-- tagline -->
  <text x="600" y="446" text-anchor="middle" fill="#9a7b3f"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600"
        letter-spacing="6">GUARDIAN OF THE LEDGER</text>
  <text x="600" y="492" text-anchor="middle" fill="#b9bcae"
        font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">
    Air-gapped agentic settlement — no payment moves until every gate clears.
  </text>
</svg>
